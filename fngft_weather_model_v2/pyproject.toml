[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fngft-ai"
version = "0.2.0"
description = "Real-data research prototype for the FNGFT-AI fractional weather architecture"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "xarray>=2026.1",
  "fsspec>=2026.1",
  "scipy>=1.14",
  "torch>=2.5",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.8",
]

[tool.setuptools.packages.find]
include = ["fngft*"]
