[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fngft-ai"
version = "0.3.0"
description = "Real-data research prototype for the FNGFT-AI fractional weather architecture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "xarray>=2024.6",
  "fsspec>=2024.6",
  "dask>=2024.6",
  "scipy>=1.14",
  "netCDF4>=1.7",
  "h5netcdf>=1.3",
  "zarr>=2.18",
  "torch>=2.5",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "pydantic>=2.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
grib = ["cfgrib>=0.9"]
sample = ["gcsfs>=2024.6"]

[project.scripts]
fngft = "fngft.cli:main"

[tool.setuptools.packages.find]
include = ["fngft*"]

[tool.setuptools.package-data]
fngft = ["static/*.html"]
